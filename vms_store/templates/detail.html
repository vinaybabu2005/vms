{% extends 'base.html' %}{% block content %}<a href="/">← Back to collection</a><div class="split detail"><div class="panel">{% if product.image %}<img class="bigimage" src="{{ product.image.url }}" alt="{{ product.name }}">{% endif %}</div><div><div class="eyebrow">{{ product.category }}</div><h1>{{ product.name }}</h1><h2>₹{{ product.price }}</h2><p>{{ product.description }}</p><p>{{ product.stock }} available • Free delivery</p><form method="post" action="{% url 'add' product.pk %}">{% csrf_token %}<button {% if not product.stock %}disabled{% endif %}>Add to cart</button></form></div></div>{% endblock %}
