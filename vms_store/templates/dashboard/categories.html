{% extends 'dashboard/base.html' %}{% block content %}<div class="detailgrid"><section class="box"><h3>Product categories</h3>{% for c in categories %}<div class="stockline"><div><strong>{{ c.name }}</strong><small>{{ c.product_count }} products</small></div><a class="delete" href="{% url 'dashboard_category_delete' c.pk %}">Delete</a></div>{% empty %}<p>No categories yet.</p>{% endfor %}</section><section class="box"><h3>Add a category</h3><form class="editform" method="post">{% csrf_token %}{{ form.as_p }}<button class="primary">Add category</button></form></section></div>{% endblock %}
