{% extends 'dashboard/base.html' %}{% block content %}<div class="pageintro"><h2>Every order, in one place.</h2><p>Track progress, update shipping, and keep customers informed.</p></div><form class="toolbar" method="get"><input name="q" value="{{ q }}" placeholder="Search order ID or customer" aria-label="Search orders"><select name="status" aria-label="Order status"><option value="">All statuses</option>{% for key,label in statuses %}<option value="{{ key }}" {% if status == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="primary">Search</button><a href="{% url 'dashboard_orders' %}">Reset</a></form><section class="box">{% include 'dashboard/_orders.html' with orders=page %}{% include 'dashboard/_pagination.html' %}</section>{% endblock %}
