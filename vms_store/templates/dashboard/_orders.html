<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody>{% for o in orders %}<tr><td><a class="stronglink" href="{% url 'dashboard_order' o.pk %}">#{{ o.pk|stringformat:'04d' }}</a></td><td><strong>{{ o.full_name }}</strong><small>{{ o.user.username }}</small></td><td>{{ o.created_at|date:'d M Y' }}</td><td><span class="badge {{ o.status }}">{{ o.get_status_display }}</span></td><td class="money">₹{{ o.total }}</td><td><a class="textlink" href="{% url 'dashboard_order' o.pk %}">Manage →</a></td></tr>{% empty %}<tr><td colspan="6" class="empty">No orders yet. New orders will appear here.</td></tr>{% endfor %}</tbody></table></div>
